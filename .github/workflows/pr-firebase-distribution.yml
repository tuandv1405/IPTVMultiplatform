# Builds a signed release AAB after every merge to main (called by version-bump.yml) and uploads it
# to Firebase App Distribution. Setup (secrets, testers, Play link): docs/ci-firebase-distribution.md
name: Build → Firebase App Distribution (Android)

on:
  # Called by version-bump.yml after every merge to main, with the commit carrying the new version.
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
  # By hand: Actions › this workflow › Run workflow, on the branch picked there.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # only used by the keyless (Workload Identity Federation) fallback

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSIPTV_STORE_FILE: ${{ github.workspace }}/ci-upload.jks
      TSIPTV_STORE_PASSWORD: ${{ secrets.TSIPTV_STORE_PASSWORD }}
      TSIPTV_KEY_ALIAS: ${{ secrets.TSIPTV_KEY_ALIAS }}
      TSIPTV_KEY_PASSWORD: ${{ secrets.TSIPTV_KEY_PASSWORD }}
      HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Empty when run by hand: the branch picked in Run workflow.
          ref: ${{ inputs.ref }}
          # The release notes read the last two commits.
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TSIPTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret TSIPTV_KEYSTORE_BASE64 is not set (see docs/ci-firebase-distribution.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$TSIPTV_STORE_FILE"

      # The Kotlin compiler runs inside the Gradle daemon so the runner does not also
      # start a separate Kotlin daemon (keeps memory within the runner's limit).
      - name: Build release AAB and APK
        run: >-
          ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease
          --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process
          -Porg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Locate AAB and APK
        id: out
        run: |
          aab=$(ls composeApp/build/outputs/bundle/release/*.aab | head -n 1)
          apk=$(ls composeApp/build/outputs/apk/release/*.apk | head -n 1)
          test -n "$aab" && test -n "$apk"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
      # After a merge: the version commit, then the merge commit and its pull request's title.
      - name: Release notes
        run: |
          {
            git log -2 --format='%s%n%b' | sed '/^[[:space:]]*$/d' | head -n 4
            echo "Commit: $(git rev-parse --short HEAD)"
          } > release-notes.txt
          cat release-notes.txt

      # Service-account JSON key (secret FIREBASE_SERVICE_ACCOUNT_JSON). If no key is set, the
      # keyless Workload Identity Federation variables are used instead (docs/ci-firebase-distribution.md).
      - name: Authenticate to Google Cloud (service-account key)
        if: env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.HAS_SA_KEY != 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # AAB first. App Distribution only accepts AABs once the Firebase project is linked to
      # Google Play; if the AAB is refused (or FIREBASE_DISTRIBUTE_FORMAT=apk), the APK built
      # from the same commit is uploaded instead.
      - name: Upload to Firebase App Distribution
        id: upload
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || '1:234600934735:android:c8d65b7ef4741dacd4a93a' }}
          # Group ALIASES (Testers & Groups › the group › alias), comma-separated; empty = upload only.
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          # Optional tester emails, comma-separated.
          TESTERS: ${{ vars.FIREBASE_TESTERS }}
          FORMAT: ${{ vars.FIREBASE_DISTRIBUTE_FORMAT || 'aab' }}
          AAB: ${{ steps.out.outputs.aab }}
          APK: ${{ steps.out.outputs.apk }}
        run: |
          distribute() {
            args=(appdistribution:distribute "$1" --app "$FIREBASE_APP_ID" --release-notes-file release-notes.txt)
            if [ -n "$TESTER_GROUPS" ]; then args+=(--groups "$TESTER_GROUPS"); fi
            if [ -n "$TESTERS" ]; then args+=(--testers "$TESTERS"); fi
            npx --yes firebase-tools@14 "${args[@]}" 2>&1 | tee distribute.log
            local status="${PIPESTATUS[0]}"
            if [ "$status" -eq 0 ]; then echo "binary=$1" >> "$GITHUB_OUTPUT"; fi
            return "$status"
          }
          # The build was uploaded but handing it to the groups failed (404 = unknown group alias).
          # Retrying with the APK would fail the same way, so stop here with a clear message.
          distribution_failed() {
            if grep -q 'failed to distribute to testers/groups' distribute.log; then
              echo "::error::The build was uploaded, but distributing it failed: no tester group with alias '$TESTER_GROUPS'. In Firebase Console › App Distribution › Testers & Groups, create the group or copy its alias into the FIREBASE_TESTER_GROUPS variable (see docs/ci-firebase-distribution.md)."
              return 0
            fi
            return 1
          }
          if [ "$FORMAT" != "apk" ]; then
            if distribute "$AAB"; then exit 0; fi
            if distribution_failed; then exit 1; fi
            echo "::warning::AAB upload failed (is Firebase linked to Google Play? see docs/ci-firebase-distribution.md). Retrying with the APK."
          fi
          if distribute "$APK"; then exit 0; fi
          if distribution_failed; then exit 1; fi
          reason=$(grep -iE 'error|denied|permission|not found|invalid' distribute.log | tail -n 3 | tr '\n' ' ')
          echo "::error::App Distribution upload failed: ${reason:-see the step log}"
          exit 1
      # AI test cases in qa/app-testing (Firebase App Testing agent, Android only; docs/ci-app-testing.md).
      # They are imported into the console (App Distribution › Test cases) so they can also be run by hand,
      # then the smoke cases run on the build just uploaded. Each case on each device takes one test of the
      # project's monthly quota (200 in the preview). FIREBASE_APP_TESTING: smoke (default) | all | off.
      - name: Firebase App Testing (AI test cases)
        if: vars.FIREBASE_APP_TESTING != 'off'
        # A failing or over-quota AI test does not fail the build unless FIREBASE_APP_TESTING_BLOCKING=true.
        continue-on-error: ${{ vars.FIREBASE_APP_TESTING_BLOCKING != 'true' }}
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || '1:234600934735:android:c8d65b7ef4741dacd4a93a' }}
          SCOPE: ${{ vars.FIREBASE_APP_TESTING || 'smoke' }}
          BLOCKING: ${{ vars.FIREBASE_APP_TESTING_BLOCKING }}
          # Semicolon-separated 'model=…,version=…,locale=…,orientation=…'; empty = the CLI's default
          # (MediumPhone.arm, Android 16, en_US, portrait).
          TEST_DEVICES: ${{ vars.FIREBASE_TEST_DEVICES }}
          # The release build cannot be used signed out: a dedicated test account (never a real user's).
          TEST_USERNAME: ${{ vars.FIREBASE_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
          BINARY: ${{ steps.upload.outputs.binary }}
        run: |
          # smoke.yaml first: regression.yaml's cases name its cases as prerequisites.
          for file in qa/app-testing/smoke.yaml qa/app-testing/regression.yaml; do
            npx --yes firebase-tools@15 appdistribution:testcases:import "$file" --app "$FIREBASE_APP_ID"
          done
          if [ -z "$TEST_USERNAME" ] || [ -z "$TEST_PASSWORD" ]; then
            echo "::notice::Test cases imported; not run: set FIREBASE_TEST_USERNAME and FIREBASE_TEST_PASSWORD (docs/ci-app-testing.md)."
            exit 0
          fi
          password_file="$RUNNER_TEMP/test-password.txt"
          printf '%s' "$TEST_PASSWORD" > "$password_file"
          trap 'rm -f "$password_file"' EXIT
          args=(apptesting:execute "$BINARY" --app "$FIREBASE_APP_ID" --test-dir qa/app-testing
            --test-username "$TEST_USERNAME" --test-password-file "$password_file")
          if [ "$SCOPE" != "all" ]; then args+=(--test-file-pattern 'smoke'); fi
          if [ -n "$TEST_DEVICES" ]; then args+=(--test-devices "$TEST_DEVICES"); fi
          if [ "$BLOCKING" != "true" ]; then args+=(--test-non-blocking); fi
          # --debug to a file: the CLI alone only says "Test invocation failed". The file is not printed,
          # because its request bodies hold the test password; only the API's error lines are.
          debug_log="$RUNNER_TEMP/apptesting-debug.log"
          status=0
          npx --yes firebase-tools@15 "${args[@]}" --debug > "$debug_log" 2>&1 || status=$?
          grep -vE '^\[[0-9TZ:.-]+\] ' "$debug_log" | grep -v 'Download the release binary' || true
          reason=$(grep -oE '"(message|status)": ?"[^"]*"' "$debug_log" | tail -n 3 | tr '\n' ' ')
          rm -f "$debug_log"
          if [ "$status" -ne 0 ]; then
            echo "::warning::App Testing did not start: ${reason:-see the step log}. A PERMISSION_DENIED here means the CI service account needs another role (docs/ci-app-testing.md)."
            exit 1
          fi

      - name: Keep the AAB and APK as workflow artifacts
        if: always() && steps.out.outputs.aab != ''
        uses: actions/upload-artifact@v5
        with:
          name: tsiptv-release-${{ github.run_number }}
          path: |
            ${{ steps.out.outputs.aab }}
            ${{ steps.out.outputs.apk }}
          retention-days: 14
      - name: Clean up secrets
        if: always()
        run: rm -f "$TSIPTV_STORE_FILE"
