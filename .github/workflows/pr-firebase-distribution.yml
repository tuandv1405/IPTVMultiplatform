# Builds a signed release AAB for every pull request and uploads it to
# Firebase App Distribution. Setup (secrets, testers, Play link): docs/ci-firebase-distribution.md
name: PR build → Firebase App Distribution

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distribute:
    # Pull requests from forks get no secrets, so they cannot be signed or uploaded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSIPTV_STORE_FILE: ${{ github.workspace }}/ci-upload.jks
      TSIPTV_STORE_PASSWORD: ${{ secrets.TSIPTV_STORE_PASSWORD }}
      TSIPTV_KEY_ALIAS: ${{ secrets.TSIPTV_KEY_ALIAS }}
      TSIPTV_KEY_PASSWORD: ${{ secrets.TSIPTV_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TSIPTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret TSIPTV_KEYSTORE_BASE64 is not set (see docs/ci-firebase-distribution.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$TSIPTV_STORE_FILE"

      # The Kotlin compiler runs inside the Gradle daemon so the runner does not also
      # start a separate Kotlin daemon (keeps memory within the runner's limit).
      - name: Build release AAB
        run: >-
          ./gradlew :composeApp:bundleRelease
          --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process
          -Porg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Locate AAB
        id: aab
        run: |
          file=$(ls composeApp/build/outputs/bundle/release/*.aab | head -n 1)
          test -n "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            if [ -n "$PR_NUMBER" ]; then echo "PR #$PR_NUMBER: $PR_TITLE"; fi
            echo "Branch: $HEAD_REF"
            echo "Commit: ${GITHUB_SHA::7}"
          } > release-notes.txt
          cat release-notes.txt

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || '1:234600934735:android:c8d65b7ef4741dacd4a93a' }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON is not set (see docs/ci-firebase-distribution.md)"
            exit 1
          fi
          creds="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          npx --yes firebase-tools@14 appdistribution:distribute "${{ steps.aab.outputs.file }}" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file release-notes.txt

      - name: Keep the AAB as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsiptv-release-aab-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ steps.aab.outputs.file }}
          retention-days: 14

      - name: Clean up secrets
        if: always()
        run: rm -f "$TSIPTV_STORE_FILE" "$RUNNER_TEMP/firebase-sa.json"
