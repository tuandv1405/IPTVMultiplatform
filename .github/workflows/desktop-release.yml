# Builds the desktop installers (Windows Setup.exe/MSI/zip, macOS dmg) and publishes them as a GitHub
# Release of the PUBLIC releases repo, then points the download page (tsiptv-download.web.app) at them.
# The app repo stays private: nothing a visitor downloads or opens links here.
# Setup (token, variables, order of steps): docs/ci-desktop-release.md
name: Desktop release → releases repo

on:
  push:
    tags: ['desktop-*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, windows, macos]
        default: all

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # only used by the keyless (Workload Identity Federation) fallback

env:
  RELEASES_REPO: ${{ vars.RELEASES_REPO || 'chintk19/tsiptv-releases' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: composeApp/build.gradle.kts
          sparse-checkout-cone-mode: false

      # The installers take versionMajor.versionMinor.versionPatch; a tag naming another version would
      # publish files whose names and MSI version disagree with the tag.
      - id: v
        run: |
          part() { sed -n "s/^val $1 = \([0-9][0-9]*\).*/\1/p" composeApp/build.gradle.kts; }
          version="$(part versionMajor).$(part versionMinor).$(part versionPatch)"
          tag="desktop-$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version. Bump versionPatch in composeApp/build.gradle.kts or tag $tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag to $RELEASES_REPO"

  windows:
    needs: version
    if: github.event_name == 'push' || inputs.platforms != 'macos'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Optional desktop "support the developer" card (docs/desktop-build.md §3). Shipped in the app,
      # so variables, not secrets.
      TSIPTV_SUPPORT_URL: ${{ vars.TSIPTV_SUPPORT_URL }}
      TSIPTV_SUPPORT_BANK_ID: ${{ vars.TSIPTV_SUPPORT_BANK_ID }}
      TSIPTV_SUPPORT_ACCOUNT_NO: ${{ vars.TSIPTV_SUPPORT_ACCOUNT_NO }}
      TSIPTV_SUPPORT_ACCOUNT_NAME: ${{ vars.TSIPTV_SUPPORT_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # Setup.exe, MSI, portable zip, README.txt (docs/desktop-windows-release.md). Downloads libVLC
      # and WiX on the way; IExpress is part of Windows.
      - name: Build the Windows packages
        shell: bash
        run: >-
          ./gradlew :composeApp:packageDesktopRelease
          --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-windows
          # SHA256SUMS.txt is written again for the whole release by the publish job.
          path: |
            composeApp/build/release/desktop/*
            !composeApp/build/release/desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: version
    if: github.event_name == 'push' || inputs.platforms != 'windows'
    # Apple Silicon runner: the dmg (and its bundled libVLC) is arm64, like the earlier releases.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    env:
      TSIPTV_SUPPORT_URL: ${{ vars.TSIPTV_SUPPORT_URL }}
      TSIPTV_SUPPORT_BANK_ID: ${{ vars.TSIPTV_SUPPORT_BANK_ID }}
      TSIPTV_SUPPORT_ACCOUNT_NO: ${{ vars.TSIPTV_SUPPORT_ACCOUNT_NO }}
      TSIPTV_SUPPORT_ACCOUNT_NAME: ${{ vars.TSIPTV_SUPPORT_ACCOUNT_NAME }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # Unsigned (ad-hoc), as the earlier releases: first launch needs Privacy & Security › Open Anyway.
      - name: Build the dmg
        run: >-
          ./gradlew :composeApp:packageReleaseDmg
          --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Name it like the download page expects
        run: |
          mkdir -p dist
          dmg=$(ls composeApp/build/compose/binaries/main-release/dmg/*.dmg | head -n 1)
          test -f "$dmg"
          cp "$dmg" "dist/TS-IPTV-$VERSION-macOS-$(uname -m | sed 's/x86_64/x64/').dmg"
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, windows, macos]
    # Runs when every requested platform built (a skipped one, e.g. macOS on "windows", is fine).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      # Fine-grained token with Contents: read and write on the releases repo only.
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check the token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASES_REPO_TOKEN is not set (see docs/ci-desktop-release.md)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/releases
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      # One SHA256SUMS.txt per release. When the release already exists (the other platform was published
      # earlier), its lines for files not rebuilt now are kept.
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          packages=(*.exe *.msi *.zip *.dmg)
          test "${#packages[@]}" -gt 0
          sha256sum -- "${packages[@]}" > new-sums.txt
          if gh release download "$TAG" --repo "$RELEASES_REPO" --pattern SHA256SUMS.txt --dir ../old 2>/dev/null; then
            awk 'NR==FNR { built[$2]=1; next } !($2 in built)' new-sums.txt ../old/SHA256SUMS.txt > kept.txt
          else
            : > kept.txt
          fi
          sort -k2 kept.txt new-sums.txt > SHA256SUMS.txt
          rm new-sums.txt kept.txt
          cat SHA256SUMS.txt

      # The note is public: docs/releases/desktop-<v>.md must not link into this (private) repo.
      - name: Release notes
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "TS IPTV desktop $VERSION" > release-notes.md; fi
          if grep -n 'IPTVMultiplatform' release-notes.md; then
            echo "::error::$notes links to the private app repo; remove those links before publishing."
            exit 1
          fi

      - name: Create or update the release
        run: |
          if gh release view "$TAG" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$RELEASES_REPO" --clobber
            gh release edit "$TAG" --repo "$RELEASES_REPO" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --repo "$RELEASES_REPO" \
              --title "TS IPTV $VERSION (desktop)" --notes-file release-notes.md
          fi
          echo "https://github.com/$RELEASES_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  download-page:
    needs: [version, publish]
    if: vars.DEPLOY_DOWNLOAD_PAGE != 'false'
    runs-on: ubuntu-latest
    env:
      HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      # The download page's source lives in the releases repo (public/releases.json, scripts/sync_github.py).
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Point releases.json at the new release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          python3 scripts/sync_github.py
          if git diff --quiet -- public/releases.json; then
            echo "releases.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Download page: ${{ needs.version.outputs.tag }}" -- public/releases.json
            git push
          fi

      - name: Authenticate to Google Cloud (service-account key)
        if: env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.HAS_SA_KEY != 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Needs the Firebase Hosting Admin role on the service account (docs/ci-desktop-release.md).
      - name: Deploy tsiptv-download.web.app
        run: npx --yes firebase-tools@15 deploy --only hosting --project tsiptv-8bdd6 --non-interactive
