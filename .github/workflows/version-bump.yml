# The only CI build: after every push (merge) to main,
# 1. versionPatch + 1 in composeApp/build.gradle.kts (Android versionCode and versionName, desktop
#    packageVersion) and CURRENT_PROJECT_VERSION + 1 (iOS build number), committed back to main;
# 2. that commit is built and sent to Firebase App Distribution: Android (pr-firebase-distribution.yml)
#    and iOS (ios-firebase-distribution.yml).
# Pull requests are not built, and never touch the version lines, so they never conflict over them.
# Setup and notes: docs/ci-firebase-distribution.md (Version).
name: Main → version bump and Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One bump at a time. A run waiting behind another may be replaced by a newer one (no bump and no
    # build for it); that is fine, since the newer run bumps and builds the latest main.
    concurrency:
      group: version-bump
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    # The bump commit is pushed with GITHUB_TOKEN, which never starts another workflow run: no loop.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump and commit
        id: bump
        run: |
          gradle_file=composeApp/build.gradle.kts
          pbxproj=iosApp/iosApp.xcodeproj/project.pbxproj
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A merge landing meanwhile rejects the push: start again from the new main.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            part() { sed -nE "s/^val $1 = ([0-9]+)\$/\1/p" "$gradle_file"; }
            major=$(part versionMajor)
            minor=$(part versionMinor)
            patch=$(part versionPatch)
            build=$(grep -m1 -oE 'CURRENT_PROJECT_VERSION = [0-9]+;' "$pbxproj" | tr -dc '0-9')
            if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ] || [ -z "$build" ]; then
              echo "::error::Version lines not found ('val versionPatch = N' in $gradle_file, 'CURRENT_PROJECT_VERSION = N;' in $pbxproj)"
              exit 1
            fi
            next_patch=$((patch + 1))
            next_build=$((build + 1))
            # versionPatch has four digits (see the version comment in $gradle_file).
            if [ "$next_patch" -gt 9999 ]; then
              echo "::error::versionPatch would pass 9999: raise versionMinor and reset versionPatch in $gradle_file"
              exit 1
            fi

            sed -i -E "s/^val versionPatch = [0-9]+\$/val versionPatch = $next_patch/" "$gradle_file"
            sed -i -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $next_build;/g" "$pbxproj"

            version_code=$((major * 1000000 + minor * 10000 + next_patch))
            git commit -q -m "Version $major.$minor.$next_patch (Android $version_code, iOS build $next_build)" -- "$gradle_file" "$pbxproj"
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "Version $major.$minor.$next_patch, Android versionCode $version_code, iOS build $next_build" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Push rejected (try $attempt), main moved on"
          done
          echo "::error::Could not push the version bump to main"
          exit 1

  # Both build exactly the version commit above, not whatever main is by the time they start.
  android:
    needs: bump
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-firebase-distribution.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
    secrets: inherit

  ios:
    needs: bump
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ios-firebase-distribution.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
    secrets: inherit
